<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ultimate beneficial ownership through a corporate chain</title>
  <desc id="desc">A top down ownership hierarchy. Person A owns 40% of the operating company directly. A holding company owns 60% and is owned by Person B at 50% and Person C at 30%. Effective control multiplies down the chain, so A at 40% and B at 30% are beneficial owners, while C at 18% is below the 25% threshold.</desc>
  <defs>
    <style>
      .bg{fill:#fbfcfd}.card{fill:#fff;stroke:#10223b;stroke-width:3.5;stroke-linejoin:round}
      .ubo{fill:#f3fbfb;stroke:#007f86;stroke-width:3.5;stroke-linejoin:round}
      .line{stroke:#007f86;stroke-width:3.5;stroke-linecap:round;fill:none}
      .title{font:700 31px Georgia,serif;fill:#10223b}.sub{font:400 17px Arial,sans-serif;fill:#4c5f74}
      .head{font:800 17px Arial,sans-serif;fill:#10223b}.body{font:600 13px Arial,sans-serif;fill:#4c5f74}
      .pct{font:800 15px Arial,sans-serif;fill:#007f86}.badge{font:800 11px Arial,sans-serif;fill:#007f86;letter-spacing:.08em}
      .panel{fill:#fff;stroke:#dbe3ec;stroke-width:2}.ptag{font:800 12px Arial,sans-serif;fill:#007f86;letter-spacing:.06em}
      .pln{font:600 14px Arial,sans-serif;fill:#253952}.pyes{font:800 14px Arial,sans-serif;fill:#007f86}.pno{font:700 14px Arial,sans-serif;fill:#8a97a6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#007f86"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text x="70" y="74" class="title">Who really owns the borrower</text>
  <text x="72" y="108" class="sub">A foreign key says a person owns a company. It does not say who ultimately controls it.</text>

  <!-- ownership edges (owner points to owned) -->
  <path class="line" marker-end="url(#arrow)" d="M745 236V336"/>
  <path class="line" marker-end="url(#arrow)" d="M995 236L830 336"/>
  <path class="line" marker-end="url(#arrow)" d="M745 422L662 516"/>
  <path class="line" marker-end="url(#arrow)" d="M210 236L505 516"/>
  <text x="762" y="292" class="pct">50%</text>
  <text x="905" y="286" class="pct">30%</text>
  <text x="712" y="474" class="pct">60%</text>
  <text x="356" y="384" class="pct">40%</text>

  <!-- persons -->
  <g text-anchor="middle">
    <g><rect class="ubo" x="110" y="152" width="200" height="84" rx="14"/><text x="210" y="192" class="head">Person A</text><text x="210" y="216" class="body">direct 40% of OpCo</text><text x="292" y="146" text-anchor="end" class="badge">UBO</text></g>
    <g><rect class="ubo" x="650" y="152" width="190" height="84" rx="14"/><text x="745" y="192" class="head">Person B</text><text x="745" y="216" class="body">50% of HoldCo</text><text x="826" y="146" text-anchor="end" class="badge">UBO</text></g>
    <g><rect class="card" x="900" y="152" width="190" height="84" rx="14"/><text x="995" y="192" class="head">Person C</text><text x="995" y="216" class="body">30% of HoldCo</text></g>
    <!-- holding -->
    <g><rect class="card" x="650" y="336" width="190" height="86" rx="14"/><text x="745" y="376" class="head">HoldCo</text><text x="745" y="400" class="body">60% of OpCo</text></g>
    <!-- operating -->
    <g><rect class="card" x="430" y="516" width="260" height="92" rx="16"/><text x="560" y="558" class="head">Operating Co</text><text x="560" y="583" class="body">the borrower</text></g>
  </g>

  <!-- effective-control summary panel -->
  <rect class="panel" x="60" y="452" width="340" height="158" rx="14"/>
  <text x="80" y="482" class="ptag">EFFECTIVE CONTROL</text>
  <text x="80" y="516" class="pln">A · 40%</text><text x="380" y="516" text-anchor="end" class="pyes">beneficial owner</text>
  <text x="80" y="548" class="pln">B · 50% × 60% = 30%</text><text x="380" y="548" text-anchor="end" class="pyes">beneficial owner</text>
  <text x="80" y="580" class="pln">C · 30% × 60% = 18%</text><text x="380" y="580" text-anchor="end" class="pno">below 25%</text>
  <text x="80" y="602" class="body">Multiplies down the chain · UBO = 25%+ (AML)</text>
</svg>
