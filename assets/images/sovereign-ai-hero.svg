<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Sovereign AI in Singapore and APAC</title>
  <desc id="desc">A hand drawn style diagram showing an enterprise control boundary connected to cloud, model and regulatory context.</desc>
  <defs>
    <style>
      .paper{fill:#fbfcfd}.ink{stroke:#10223b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}.soft{stroke:#007f86;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}.dash{stroke-dasharray:10 9}.fill{fill:#f3fbfb;stroke:#10223b;stroke-width:4}.note{font:700 28px Georgia,serif;fill:#10223b}.small{font:600 17px Arial,sans-serif;fill:#40536b}.label{font:700 18px Arial,sans-serif;fill:#10223b}.muted{fill:#5d6b7d}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#007f86"/>
    </marker>
  </defs>
  <rect class="paper" width="1200" height="675"/>
  <path class="ink" d="M72 86c245-18 487-15 720 0 71 5 137 12 202 21"/>
  <text x="76" y="148" class="note">Sovereign AI is not isolation.</text>
  <text x="76" y="184" class="small">It is retained authority over data, models, decisions and operations.</text>
  <rect class="fill" x="330" y="250" width="540" height="270" rx="22"/>
  <path class="soft dash" d="M368 286h462v197H368z"/>
  <text x="600" y="332" text-anchor="middle" class="label">ENTERPRISE CONTROL BOUNDARY</text>
  <circle cx="472" cy="402" r="54" fill="#ffffff" stroke="#10223b" stroke-width="4"/>
  <path class="ink" d="M452 403l15 15 31-39"/>
  <text x="472" y="480" text-anchor="middle" class="small">Policy</text>
  <circle cx="600" cy="402" r="54" fill="#ffffff" stroke="#10223b" stroke-width="4"/>
  <path class="ink" d="M580 386h40v34h-40zM590 386v-13c0-28 20-34 32-16"/>
  <text x="600" y="480" text-anchor="middle" class="small">Data</text>
  <circle cx="728" cy="402" r="54" fill="#ffffff" stroke="#10223b" stroke-width="4"/>
  <path class="ink" d="M704 404c24-31 47-31 72 0M710 424h35"/>
  <text x="728" y="480" text-anchor="middle" class="small">Decision</text>
  <path class="soft" marker-end="url(#arrow)" d="M224 373h90"/>
  <path class="soft" marker-end="url(#arrow)" d="M886 373h80"/>
  <path class="soft" marker-end="url(#arrow)" d="M600 184v50"/>
  <path class="soft" marker-end="url(#arrow)" d="M600 522v52"/>
  <rect x="92" y="332" width="128" height="82" rx="14" fill="#fff" stroke="#007f86" stroke-width="4"/>
  <text x="156" y="365" text-anchor="middle" class="label">Cloud</text>
  <text x="156" y="391" text-anchor="middle" class="small">services</text>
  <rect x="982" y="332" width="136" height="82" rx="14" fill="#fff" stroke="#007f86" stroke-width="4"/>
  <text x="1050" y="365" text-anchor="middle" class="label">Models</text>
  <text x="1050" y="391" text-anchor="middle" class="small">replaceable</text>
  <rect x="514" y="92" width="172" height="82" rx="14" fill="#fff" stroke="#007f86" stroke-width="4"/>
  <text x="600" y="126" text-anchor="middle" class="label">Regulators</text>
  <text x="600" y="152" text-anchor="middle" class="small">evidence</text>
  <rect x="506" y="590" width="188" height="56" rx="14" fill="#fff" stroke="#007f86" stroke-width="4"/>
  <text x="600" y="625" text-anchor="middle" class="label">Stop or exit</text>
  <path class="ink" d="M105 548c51 24 104 19 160 5M914 121c48-13 93-8 136 16M942 570c46-22 94-24 145-6"/>
</svg>
